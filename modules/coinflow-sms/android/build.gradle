apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.coinflowsms'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.coinflowsms"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService / Arguments / HeadlessJsTaskConfig — version comes from the app's RN.
  implementation "com.facebook.react:react-android"
}
